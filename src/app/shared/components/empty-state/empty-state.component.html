<div class="empty-state" role="status">
  <div class="icon-wrap" [attr.data-icon]="icon" aria-hidden="true">
    <svg *ngIf="icon === 'inbox'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 13h4l2 3h6l2-3h4M3 13l2-7h14l2 7M3 13v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg *ngIf="icon === 'document'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 3v5h5M9 13h6M9 17h4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg *ngIf="icon === 'search'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="7" stroke-linecap="round"/>
      <path d="m20 20-3.5-3.5" stroke-linecap="round"/>
    </svg>
    <svg *ngIf="icon === 'check'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="9" stroke-linecap="round"/>
      <path d="m8 12 3 3 5-6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h3 class="title">{{ title }}</h3>
  <p *ngIf="description" class="description">{{ description }}</p>

  <button
    *ngIf="actionLabel"
    type="button"
    class="btn"
    [class.btn-primary]="actionVariant === 'primary'"
    [class.btn-secondary]="actionVariant === 'secondary'"
    (click)="onAction()"
  >
    {{ actionLabel }}
  </button>
</div>
