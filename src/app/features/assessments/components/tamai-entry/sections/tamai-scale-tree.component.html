<ng-container *ngFor="let n of nodes">
  <tamai-scale-input
    [group]="groupOf(n.code)"
    [abbr]="n.code"
    [label]="n.label"
    [depth]="n.depth"
  ></tamai-scale-input>
  <tamai-scale-tree
    *ngIf="n.children?.length"
    [nodes]="n.children!"
    [escalasGroup]="escalasGroup"
  ></tamai-scale-tree>
</ng-container>
