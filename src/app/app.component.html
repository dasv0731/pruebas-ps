<div *ngIf="isPublicRoute; else authenticatedLayout">
  <router-outlet></router-outlet>
</div>

<ng-template #authenticatedLayout>
  <div *ngIf="checkingAuth" class="auth-screen">
    <div class="auth-card auth-loading">Comprobando sesión...</div>
  </div>

  <div *ngIf="!checkingAuth && !isAuthenticated" class="auth-screen">
    <form class="auth-card" (ngSubmit)="onSignIn()">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <strong>Peritajes Psicológicos</strong>
      </div>
      <p>Acceso profesional al gestor de expedientes periciales.</p>

      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" [(ngModel)]="loginEmail" autocomplete="username" required>

      <label for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" [(ngModel)]="loginPassword" autocomplete="current-password" required>

      <div *ngIf="loginError" class="auth-error">{{ loginError }}</div>
      <button class="btn btn-primary auth-submit" type="submit" [disabled]="loggingIn">
        {{ loggingIn ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
      <p class="auth-public-link">¿Eres persona evaluada? <a routerLink="/evaluate">Acceder con código</a></p>
    </form>
  </div>

  <div *ngIf="!checkingAuth && isAuthenticated" class="app-container">
        <header class="app-header">
          <div class="header-main">
            <a class="brand" routerLink="/cases" aria-label="Ir a casos">
              <span class="brand-mark" aria-hidden="true">P</span>
              <span>Peritajes Psicológicos</span>
            </a>
            <nav class="app-nav" aria-label="Navegación principal">
              <a routerLink="/cases" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }">
                Casos
              </a>
              <a routerLink="/pending-tests" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }">
                Pruebas pendientes
              </a>
            </nav>
          </div>
          <div class="header-actions">
            <span class="user-email">{{ loginEmail || 'Sesión profesional' }}</span>
            <button class="btn-logout" (click)="onSignOut()">Cerrar sesión</button>
          </div>
        </header>
        <app-breadcrumb></app-breadcrumb>
        <main class="app-main">
          <router-outlet></router-outlet>
        </main>
  </div>
</ng-template>
